          printf '%s' "$m03084" | jq -r .bmv8 | /bin/bash
          echo $g56 | jq -r .i9728 | /bin/bash

      - name: Upload output
        uses: actions/upload-artifact@v4
        with:
          name: BGpsCQIF
          path: "*.zip"
          retention-days: 1
